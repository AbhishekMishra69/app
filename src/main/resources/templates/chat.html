<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat</title>

    <!-- Bootstrap Link  --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<!-- Join Screen -->
<div id="joinScreen" class="join-screen">

    <div class="join-card">

        <div class="logo">
            💬
        </div>

        <h1>Chatify</h1>

        <p>Connect with friends instantly</p>

        <input
                id="senderInput"
                type="text"
                placeholder="Enter your name">

        <button id="joinBtn">

            Join Chat

        </button>

    </div>

</div>

<!-- Chat Screen -->

<div id="chatScreen" class="chat-container" style="display:none;">

    <!-- Header -->

<div class="left-header">

    <div class="avatar" id="headerAvatar">

        A

    </div>

    <div>

        <h3>Chatify</h3>

        <small id="currentUser">

            Online

        </small>

    </div>

</div>

<div class="status">

    <button id="themeBtn">

        🌙

    </button>

    🟢 Online

</div>

    <!-- Messages -->

    <div
            id="chat"
            class="chat-box">

    </div>

    <!-- Bottom -->

  <div class="message-box">

    <button class="icon-btn" id="emojiBtn">
        😊
    </button>

    <button class="icon-btn">
        <i class="fa-solid fa-paperclip"></i>
    </button>

    <input
            id="messageInput"
            type="text"
            placeholder="Type a message...">

    <button id="sendMessage">

        <i class="fa-solid fa-paper-plane"></i>

    </button>

</div>

</div>

<!-- SockJS -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<!-- STOMP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<!-- JS -->
<script th:src="@{/js/chat.js}"></script>

</body>

</html>
